<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{background:#1E7B5C;position:relative;font-family:"DM Sans",sans-serif;color:#fff}
.c{position:absolute;border-radius:50%}
.t{position:absolute;left:84px;top:150px;width:640px}
.tag{display:inline-block;background:#FFC83D;color:#14161A;font-weight:700;font-size:20px;letter-spacing:2px;padding:10px 20px;border-radius:999px}
h1{font-family:"Space Grotesk",sans-serif;font-size:92px;line-height:1;margin:28px 0 20px;letter-spacing:-3px}
p{font-size:30px;line-height:1.35;color:#DDF1E8;margin:0}
.tiles{position:absolute;right:64px;top:105px;display:grid;grid-template-columns:repeat(3,126px);gap:16px}
.tile{width:126px;height:126px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:64px}
</style></head><body>
<div class="c" style="width:520px;height:520px;background:#145640;right:-120px;bottom:-200px"></div>
<div class="t"><span class="tag">STUDENTS ONLY · FREE TO USE</span><h1>CampusSwap</h1><p>Give away, swap or sell dorm items.<br>Pick them up right in your building.</p></div>
<div class="tiles">
  <div class="tile" style="background:#FFF3D1">💡</div><div class="tile" style="background:#FFE3DC">☕</div><div class="tile" style="background:#DDF1E8">📚</div>
  <div class="tile" style="background:#DDF1E8">🪴</div><div class="tile" style="background:#FFC83D">🛏️</div><div class="tile" style="background:#FFE3DC">🎧</div>
  <div class="tile" style="background:#FFE3DC">👕</div><div class="tile" style="background:#DDF1E8">🍳</div><div class="tile" style="background:#FFF3D1">⚽</div>
</div>
</body></html>
